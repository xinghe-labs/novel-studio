[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "novel-studio"
version = "2.3.0"
description = "Zero-dependency Python workflow engine for writing long-form fiction with an AI agent: transactional canonical writes, single-writer leases, content-hash quality gates."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["ai-agents", "agent-skills", "novel-writing", "workflow", "continuity"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Version Control",
  "Topic :: Text Processing :: General",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/xinghe-labs/novel-studio"
Changelog = "https://github.com/xinghe-labs/novel-studio/blob/main/CHANGELOG.md"
Issues = "https://github.com/xinghe-labs/novel-studio/issues"

[tool.setuptools]
# The runtime is a skill driven from a clone, not an installable library;
# this manifest exists so the version, license, and metadata are machine-readable.
packages = []
